<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBOK — planche de typos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600&family=Bebas+Neue&family=Teko:wght@500;600&family=Saira+Condensed:wght@600;700&family=Saira:wght@400;600&family=Exo+2:wght@400;600;700&family=Rajdhani:wght@500;700&family=Orbitron:wght@600;700&family=Oxanium:wght@400;600;700&family=Unbounded:wght@500;600&family=Russo+One&family=Archivo:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F0E7;--card:#FBF9F4;--ink:#1C1A17;--ink-2:#5A5248;--ink-3:#776F64;--accent:#B32A3B;--bordeaux:#5E1420;--chalk:#F4F0E7;--line:rgba(28,26,23,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/22px 'Archivo',sans-serif;padding:40px 32px}
h1{font:500 22px/28px 'Archivo';margin:0 0 4px}
.intro{color:var(--ink-2);margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:1376px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 24px 24px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;justify-content:space-between;font:400 12px/16px 'JetBrains Mono',monospace;color:var(--ink-3)}
.meta b{font-weight:500;color:var(--ink)}
.h{font-size:56px;line-height:.98;margin:0;text-transform:uppercase}
.h span{display:block;color:var(--accent)}
.p{color:var(--ink-2);font-size:16px;line-height:24px;margin:0}
.une{background:var(--bordeaux);color:var(--chalk);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline}
.une .t{font-size:30px;line-height:1;text-transform:uppercase}
.une .d{font:500 12px 'JetBrains Mono',monospace;color:#F2C2C8}
@media (max-width:900px){.grid{grid-template-columns:1fr}body{padding:24px 16px}}
</style></head><body>
<h1>Planche de typos pour EBOK</h1>
<p class="intro">Même titre, même phrase, même bloc « À la une » dans chaque police. Réponds avec un numéro (ou deux pour mélanger titres et texte).</p>
<div class="grid" id="g"></div>
<script>
const F=[
 ['Anton','Anton',400,'Archivo','La typo actuelle du site, pour comparer'],
 ['Oswald','Oswald',600,'Oswald','Celle de la carte Instagram de l\'admin'],
 ['Bebas Neue','Bebas Neue',400,'Archivo','Affiche de match, très condensée'],
 ['Teko','Teko',600,'Teko','Sport et tech, compacte'],
 ['Saira Condensed','Saira Condensed',700,'Saira','Équipementier sportif, nette'],
 ['Exo 2','Exo 2',700,'Exo 2','Futuriste, se lit bien en texte'],
 ['Rajdhani','Rajdhani',700,'Rajdhani','Futuriste carrée, tableau d\'affichage'],
 ['Orbitron','Orbitron',700,'Archivo','Très futuriste, pour les titres seulement'],
 ['Oxanium','Oxanium',700,'Oxanium','Futuriste anguleuse, jeu vidéo'],
 ['Unbounded','Unbounded',600,'Archivo','Large et ronde, moderne'],
 ['Russo One','Russo One',400,'Archivo','Sport mécanique, massive'],
 ['Saira','Saira',600,'Saira','Large et technique, plus douce'],
];
document.getElementById('g').innerHTML=F.map(([n,f,w,body,desc],i)=>`<div class="card">
 <div class="meta"><span><b>${i+1}. ${n}</b>${body!==f?' + '+body:''}</span><span>${desc}</span></div>
 <p class="h" style="font-family:'${f}';font-weight:${w}">Partout où <span>ça joue</span></p>
 <p class="p" style="font-family:'${body}'">Tournois, camps, 3x3, détections : tout le basket francophone sur une seule carte.</p>
 <div class="une"><span class="t" style="font-family:'${f}';font-weight:${w}">La Ligue C</span><span class="d">27–04 JUIN · JUIL</span></div>
</div>`).join('');
</script>
</body></html>

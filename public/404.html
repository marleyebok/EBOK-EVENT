<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — EBOK Event</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .nf{min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding:32px 16px;}
    .nf-box{max-width:560px;text-align:center;}
    .nf-code{font-family:var(--font-display);font-size:clamp(96px,22vw,168px);line-height:.9;color:var(--orange);letter-spacing:2px;}
    .nf-tag{font-family:var(--font-mono);font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--chalk-dim);margin:14px 0 18px;}
    .nf h1{font-size:clamp(26px,5vw,36px);margin-bottom:14px;}
    .nf p{color:var(--chalk-dim);line-height:1.6;margin:0 0 28px;}
    .nf-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
    .nf-actions .btn{text-decoration:none;display:inline-block;}
  </style>
</head>
<body>

<header class="legal-top">
  <a class="legal-back" href="/">
    <img class="brand-logo" src="/assets/logo.png" alt="EBOK Event">
    <span>Retour au site</span>
  </a>
</header>

<main class="nf">
  <div class="nf-box">
    <div class="nf-code">404</div>
    <div class="nf-tag">Air ball</div>
    <h1>Cette page n'est pas sur le terrain</h1>
    <p>
      Le lien est peut-être ancien, ou l'événement a été retiré par son
      organisateur. Les tournois, camps et circuits 3x3 à venir t'attendent
      sur la carte.
    </p>
    <div class="nf-actions">
      <a class="btn btn-primary" href="/">Voir les événements</a>
    </div>
  </div>
</main>

</body>
</html>

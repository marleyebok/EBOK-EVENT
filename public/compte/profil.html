<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mon profil — EBOK Event</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="dash" id="dash" hidden>
    <aside class="dash-side" id="dashSide"></aside>

    <main class="dash-main">
      <div class="dash-head">
        <h1>Mon profil</h1>
        <p class="dash-crumb">Compte · Profil — ces infos sont valables sur toute la galaxie EBOK.</p>
      </div>

      <div class="dash-toast" id="toast" hidden>✓ Profil enregistré.</div>
      <div class="dash-error" id="error" hidden></div>

      <form class="dash-card dash-form" id="form">
        <label>
          Tu es
          <select name="role" id="f-role"><option value="">—</option></select>
        </label>

        <label>
          Si « Autre », précise
          <input name="roleOther" type="text" maxlength="60" placeholder="Ex. : Préparateur physique" />
        </label>

        <label>
          Niveau de pratique
          <select name="level" id="f-level"><option value="">—</option></select>
        </label>

        <div class="dash-form-row">
          <label>
            Club / équipe
            <input name="club" type="text" maxlength="80" placeholder="Ex. : ASVEL, Paris Basketball…" />
          </label>
          <label>
            Homme / Femme
            <select name="gender" id="f-gender"><option value="">—</option></select>
          </label>
        </div>

        <div class="dash-form-row">
          <label>
            Âge
            <input name="age" type="number" min="0" max="120" placeholder="Ex. : 24" />
          </label>
          <label>
            Localisation
            <input name="location" type="text" maxlength="80" placeholder="Ville, région…" />
          </label>
        </div>

        <fieldset class="dash-fieldset">
          <legend>Quels outils EBOK comptes-tu utiliser ? (plusieurs choix)</legend>
          <div class="dash-chips" id="f-tools"></div>
        </fieldset>

        <div>
          <button class="dash-btn" type="submit" id="submit">Enregistrer mon profil</button>
        </div>
      </form>

      <p class="dash-muted" style="margin-top:16px">
        Nom, e-mail, mot de passe ou suppression du compte →
        <a href="/compte/general" style="color:var(--d-accent);font-weight:600">Général</a>.
      </p>
    </main>
  </div>

  <script type="module" src="/js/compte-profil.js"></script>
</body>
</html>
